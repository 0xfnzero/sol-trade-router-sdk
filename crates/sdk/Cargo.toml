[package]
name = "sol-trade-router-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "Client SDK for sol-trade-router-sdk — simple multi-hop buys/sells with no RPC on the hot path"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version = "1.91"
keywords = ["solana", "trading", "router", "defi", "sdk"]
include = ["src/**", "tests/fixtures/**", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
solana-sdk = { workspace = true }
solana-system-interface = { workspace = true }
sol-parser-sdk = { workspace = true }
sol-trade-sdk = { workspace = true }
tokio = { workspace = true }
solana-hash = { workspace = true }
solana-message = { workspace = true }
core_affinity = { workspace = true }
spl-token-2022-interface = "=3.1.2"

[dev-dependencies]
async-trait = "0.1"
base64 = "0.22"
solana-client = "=4.2.2"
solana-commitment-config = "3"
solana-transaction-status = "=4.2.2"
serde_json = "1"
bincode = "1.3"
wincode = "0.5"
