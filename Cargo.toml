[workspace]
resolver = "2"
members = [
    "programs/router",
    "crates/sdk",
]
default-members = ["crates/sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["fnzero"]
repository = "https://github.com/0xfnzero/sol-trade-router"

[workspace.dependencies]
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6"
pinocchio-token = "0.7"
anyhow = "1"
thiserror = "2"
solana-sdk = "2.2"
spl-associated-token-account = "6"
spl-token = "7"
